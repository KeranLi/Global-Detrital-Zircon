<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SearchResultsPage</title>
    <link rel="stylesheet" href="NavigationBar.css">
    <link rel="stylesheet" href="search.css">
    <script src="Homesearch.js"></script>
    <script src="download.js"></script>
    
</head>
<body>
    <header>
        <!-- loge -->
        <nav>
    
        </nav>
        <nav class="NavigationBar"> 
            <a href="HomePage.html">主页</a>
            <a href="#">关于</a>
            <a href="#">服务</a>
        </nav>
        
     </header>
    <!-- 搜索框 -->
    <div id="search">
        经度范围
        <input class="input-field" id="lng_L" type="text" value=Data.lng_L>
        <input class="input-field" id="lng_R" type="text">
        纬度范围
        <input class="input-field" id="lat_L" type="text">
        <input class="input-field" id="lat_R" type="text">
        <button id ="btn_2" >搜索</button>
    </div>
    <div class="搜索结果如下">
        搜索结果如下
    </div>
    
    <div class="download-button-container">
        <a id="link"  class="download-button">Download</a>
    </div>
 
</body>
<style>
    .NavigationBar{
        width: 99%;
        height: 60px;
        border: none;
    }
    .搜索结果如下{
        margin-top: 18px;
        margin-left: 8px;
    }
    .download-button-container {
    text-align: center;
    margin-top: 140px;
    }
    
    .download-button {
        display: inline-block;
        padding: 15px 30px;
        color: #fff;
        text-decoration: none;
        text-transform: uppercase;
        font-size: 16px;
        font-weight: bold;
        border-radius: 5px;
        background-color: #4CAF50; /* 绿色背景 */
        border: none;
        cursor: pointer;
        transition: background-color 0.3s ease;
    }
    
    .download-button:hover {
        background-color: #45a049; /* 悬停时背景颜色稍暗 */
    }
    
    .download-button:active {
        background-color: #388e3c; /* 点击时背景颜色更暗 */
    }
</style>
<script> 
    
    var Data = JSON.parse(localStorage.getItem('userData'));
    //点击事件发生的时候
    var btn = document.getElementById('btn_2');
    btn.onclick = function() {
    // 获取用户输入的值
    var lng_L = document.getElementById('lng_L').value;
    var lng_R = document.getElementById('lng_R').value;
    var lat_L = document.getElementById('lat_L').value;
    var lat_R = document.getElementById('lat_R').value;

    // 创建 JSON 对象
    var data = {
        lng_L: lng_L,
        lng_R: lng_R,
        lat_L: lat_L,
        lat_R: lat_R
    };

    if (!lng_L || !lng_R || !lat_L || !lat_R) {
        alert("请填写所有经纬度信息"); // 当发现空字段时显示提示
        return; 
    }
    else{

    // 将 JSON 对象转换为字符串
    var jsonString = JSON.stringify(data);

    // 存储 JSON 字符串到 localStorage
    localStorage.setItem('userData', jsonString);
    window.location.href = 'DownloadPage.html';
     }
};
</script>
</html>
